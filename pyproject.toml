[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "matnets"
version = "3.1.1"
description = "A small experimental neural network library where neurons are represented as matrices."
readme = "docs/index.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "dsainvg" }
]
keywords = ["neural-networks", "matrix", "machine-learning", "jax", "non-classical-networks"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jax>=0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://dev.dsainvg.me/MATNETS"
Documentation = "https://dev.dsainvg.me/MATNETS/api"
Issues = "https://github.com/dsainvg/MATNETS/issues"
Repository = "https://github.com/dsainvg/MATNETS/"



[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["matnets"]
