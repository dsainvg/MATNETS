site_name: MATNETS
site_description: Matrix-neuron neural network experiments for Python 3.11+
site_author: MATNETS Team

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts:
    - Matrix-Neurons: concepts/matrix-neurons.md
    - The Dense Primitive: concepts/dense-primitive.md
    - Structural Pooling: concepts/structural-pooling.md
    - Activations: concepts/activations.md
    - Recurrent Architectures: concepts/recurrent.md
    - JAX Transforms Compatibility: concepts/jax-compatibility.md
  - API Guide:
    - Initialization & Parameters: api/initialization.md
    - Core Layers: api/core-layers.md
    - Convolutions: api/convolutions.md
    - Activations: api/activations.md
    - Pooling: api/pooling.md
    - Attention: api/attention.md
    - Recurrent Networks: api/recurrent.md
    - Utilities: api/utilities.md
  - Examples: examples.md
  - Development: development.md
